<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Simple E-Commerce</title>
    <link rel="stylesheet" href="Brainwave2.css">
</head>
<body>
    <header>
        <h1>ShopEasy</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Contact</a></li>
                <li class="cart">🛒 Cart (<span id="cart-count">0</span>)</li>
            </ul>
        </nav>
    </header>
    
    <main>
        <div class="products">
            <div class="product" data-id="1" data-name="Product 1" data-price="20">
                <img src="product1.jpg" alt="Product 1">
                <h2>Product 1</h2>
                <p>$20</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
            <div class="product" data-id="2" data-name="Product 2" data-price="35">
                <img src="product2.jpg" alt="Product 2">
                <h2>Product 2</h2>
                <p>$35</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 ShopEasy. All rights reserved.</p>
    </footer>
    
    <script src="Brainwave2.js"></script>
</body>
</html>
